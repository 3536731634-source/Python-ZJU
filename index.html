<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python知识库 · 第1~7章完整版（外部数据）</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>hljs.highlightAll();</script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fb;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        .sidebar {
            width: 300px;
            background: #ffffff;
            border-right: 1px solid #e4e7ec;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            z-index: 10;
        }
        .sidebar-header {
            padding: 1.5rem 1.2rem;
            border-bottom: 1px solid #edf2f7;
        }
        .sidebar-header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            background: linear-gradient(135deg, #1e3c72, #2b3b6e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .sidebar-header p {
            font-size: 0.75rem;
            color: #5b6e8c;
            margin-top: 6px;
        }
        .nav-container {
            flex: 1;
            padding: 1rem 0.8rem 2rem 0.8rem;
        }
        .chapter {
            margin-bottom: 0.8rem;
            border-radius: 12px;
        }
        .chapter.active-chapter {
            background: #f0f4fe;
        }
        .chapter-title {
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.6rem 0.8rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #1e2a3e;
            border-radius: 10px;
        }
        .chapter-title:hover {
            background: #f1f5f9;
            color: #2563eb;
        }
        .topic-list {
            list-style: none;
            padding-left: 1.4rem;
            margin-top: 0.2rem;
            display: none;
        }
        .chapter.open .topic-list {
            display: block;
        }
        .topic-list li {
            font-size: 0.85rem;
            padding: 0.45rem 0.8rem;
            cursor: pointer;
            border-radius: 8px;
            color: #334155;
        }
        .topic-list li:hover {
            background: #eef2ff;
        }
        .topic-list li.active-topic {
            background: #e0e7ff;
            color: #1d4ed8;
            font-weight: 500;
            border-left: 3px solid #3b82f6;
        }
        .main {
            flex: 1;
            overflow-y: auto;
            background: #f8fafc;
            padding: 2rem 2rem 3rem 2rem;
        }
        .content-card {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.05);
            padding: 2rem 2.2rem;
        }
        .topic-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #0f172a;
        }
        .topic-meta {
            font-size: 0.8rem;
            color: #6c86a3;
            border-bottom: 2px solid #eef2ff;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }
        .text-content {
            line-height: 1.65;
            color: #1e293b;
        }
        .code-block {
            background: #0f172a;
            border-radius: 16px;
            padding: 1rem;
            overflow-x: auto;
            margin: 1.2rem 0;
        }
        .code-block code {
            font-family: monospace;
            font-size: 0.85rem;
            color: #e2e8f0;
        }
        hr {
            margin: 2rem 0;
            border: none;
            height: 1px;
            background: #e2e8f0;
        }
        .answer-highlight {
            color: #0f6b3a;
            font-weight: 600;
            background-color: #e0f2e9;
            padding: 0.1rem 0.3rem;
            border-radius: 10px;
        }
        .tf-highlight {
            color: #b45309;
            font-weight: 600;
            background-color: #fff3e3;
            padding: 0.1rem 0.3rem;
            border-radius: 10px;
        }
        .option-line {
            margin: 0.2rem 0;
        }
        .loading {
            text-align: center;
            padding: 3rem;
            font-size: 1.2rem;
            color: #6c86a3;
        }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-header">
        <h1>🐍 Python知识库</h1>
        <p>第1~7章 · 完整题库（外部数据）</p>
    </div>
    <div class="nav-container" id="nav-container"><div class="loading">加载目录中...</div></div>
</div>
<div class="main">
    <div class="content-card" id="content-area"><div class="loading">加载题目中...</div></div>
</div>

<script>
    let knowledgeBase = [];
    let activeChapter = 0;
    let activeTopic = 0;

    async function loadData() {
        try {
            const files = ['data1.json', 'data2.json', 'data3.json'];
            for (const file of files) {
                const resp = await fetch(file);
                if (!resp.ok) throw new Error(`加载 ${file} 失败：${resp.status}`);
                const data = await resp.json();
                knowledgeBase = knowledgeBase.concat(data);
            }
            buildSidebar();
            renderTopicContent(0, 0);
        } catch (err) {
            document.getElementById('nav-container').innerHTML = `<div class="loading">❌ 加载失败: ${err.message}<br>请确保 data1.json, data2.json, data3.json 与 HTML 在同一目录下，并使用 HTTP 服务器访问（如 python -m http.server 8080）。</div>`;
            document.getElementById('content-area').innerHTML = `<div class="loading">❌ 数据加载失败</div>`;
            console.error(err);
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function renderTopicContent(chapterIdx, topicIdx) {
        const chapter = knowledgeBase[chapterIdx];
        if (!chapter) return;
        const topic = chapter.topics[topicIdx];
        if (!topic) return;
        const contentDiv = document.getElementById('content-area');
        let codeHtml = '';
        if (topic.code && topic.code.trim()) {
            codeHtml = `<div class="code-block"><pre><code class="language-python">${escapeHtml(topic.code)}</code></pre></div>`;
        }
        contentDiv.innerHTML = `
            <h1 class="topic-title">${escapeHtml(topic.name)}</h1>
            <div class="topic-meta">章节 ${chapterIdx+1} · 知识点 ${topicIdx+1}</div>
            <div class="text-content">${topic.text}</div>
            ${codeHtml}
            <hr />
            <div style="font-size:0.8rem; color:#6c86a3;">✅ 所有题目答案已标色，选项单独换行，判断题T/F标色。</div>
        `;
        document.querySelectorAll('.code-block pre code').forEach(block => hljs.highlightElement(block));
    }

    function buildSidebar() {
        const container = document.getElementById('nav-container');
        let html = '';
        knowledgeBase.forEach((chapter, chIdx) => {
            const isOpen = (chIdx === activeChapter);
            html += `<div class="chapter ${isOpen ? 'open' : ''} ${chIdx === activeChapter ? 'active-chapter' : ''}" data-chapter-index="${chIdx}">
                        <div class="chapter-title">
                            <span>${escapeHtml(chapter.chapter)}</span>
                            <span class="toggle-icon">${isOpen ? '▼' : '▶'}</span>
                        </div>
                        <ul class="topic-list">`;
            chapter.topics.forEach((topic, tIdx) => {
                const activeClass = (chIdx === activeChapter && tIdx === activeTopic) ? 'active-topic' : '';
                html += `<li class="${activeClass}" data-topic-index="${tIdx}">${escapeHtml(topic.name)}</li>`;
            });
            html += `</ul></div>`;
        });
        container.innerHTML = html;

        document.querySelectorAll('.chapter').forEach(chDiv => {
            const header = chDiv.querySelector('.chapter-title');
            const chIdx = parseInt(chDiv.dataset.chapterIndex);
            header.addEventListener('click', (e) => {
                e.stopPropagation();
                const wasOpen = chDiv.classList.contains('open');
                if (!wasOpen) {
                    document.querySelectorAll('.chapter').forEach(c => c.classList.remove('open', 'active-chapter'));
                    chDiv.classList.add('open', 'active-chapter');
                    activeChapter = chIdx;
                    if (activeTopic >= knowledgeBase[activeChapter].topics.length) activeTopic = 0;
                    updateSidebarActiveState();
                    renderTopicContent(activeChapter, activeTopic);
                } else {
                    chDiv.classList.remove('open');
                }
                const iconSpan = header.querySelector('.toggle-icon');
                if (iconSpan) iconSpan.innerText = chDiv.classList.contains('open') ? '▼' : '▶';
            });
        });

        document.querySelectorAll('.topic-list li').forEach(li => {
            li.addEventListener('click', (e) => {
                e.stopPropagation();
                const parentChapter = li.closest('.chapter');
                const chIdx = parseInt(parentChapter.dataset.chapterIndex);
                const tIdx = parseInt(li.dataset.topicIndex);
                if (!isNaN(chIdx) && !isNaN(tIdx)) {
                    activeChapter = chIdx;
                    activeTopic = tIdx;
                    document.querySelectorAll('.chapter').forEach(ch => ch.classList.remove('open', 'active-chapter'));
                    parentChapter.classList.add('open', 'active-chapter');
                    const icon = parentChapter.querySelector('.toggle-icon');
                    if (icon) icon.innerText = '▼';
                    updateSidebarActiveState();
                    renderTopicContent(activeChapter, activeTopic);
                }
            });
        });
    }

    function updateSidebarActiveState() {
        document.querySelectorAll('.topic-list li').forEach(li => li.classList.remove('active-topic'));
        const activeDiv = document.querySelector(`.chapter[data-chapter-index="${activeChapter}"]`);
        if (activeDiv) {
            const activeLi = activeDiv.querySelector(`.topic-list li[data-topic-index="${activeTopic}"]`);
            if (activeLi) activeLi.classList.add('active-topic');
            activeDiv.classList.add('active-chapter');
            if (!activeDiv.classList.contains('open')) {
                activeDiv.classList.add('open');
                const iconSpan = activeDiv.querySelector('.toggle-icon');
                if (iconSpan) iconSpan.innerText = '▼';
            }
        }
    }

    loadData();
</script>
</body>
</html>
